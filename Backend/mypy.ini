[mypy]
python_version = 3.12
strict = true
plugins = sqlalchemy.ext.mypy.plugin
mypy_path = .
# Explicit paths (not `packages =`) so the local alembic/ dir is checked
# instead of the installed alembic package in .venv.
files = app, scripts, tests, alembic/env.py, alembic/versions
exclude = ^\.venv/


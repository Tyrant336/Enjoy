[project]
name = "enjoy-backend"
version = "0.1.0"
description = "enjoy — Harbour of Learning backend (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.117.1",
    "uvicorn==0.32.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sse-starlette==2.2.1",
    "python-multipart==0.0.20",
    # IANA tz database for zoneinfo — required on Windows (no system tzdata);
    # "today"/due-cards/days-active are user-timezone-aware (REQUIREMENTS §4.4, FR-4.2).
    "tzdata==2025.2",
    # P1 (REQUIREMENTS §0.2): the ONE OpenRouter LLM client (app/core/llm.py)
    # is built on langchain-openai; LangGraph hosts the ingestion→generation
    # graphs and the scheduler plan-execute-replan internals (FR-1.5 P1).
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    # Shared ingestion pipeline (FR-2.1/FR-3.1): PDFs are parsed to TEXT by
    # Docling; the LLM receives extracted text, never page images.
    # Requires pydantic >= 2.10 (2.9.x crashes docling model registration).
    "docling==2.129.0",
    # FR-2.3 .apkg export at generation time.
    "genanki==0.13.1",
    # FR-2.8 P1: real FSRS scheduling (PyPI name is `fsrs`, project: py-fsrs).
    "fsrs==6.3.2",
    # FR-3.2: the ONLY sanctioned fallback — KeyBERT extraction when LLM
    # extraction fails (WARNING log + fallbackUsed in the response).
    "keybert==0.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# Coverage report always prints; the AGENTS.md §6 >=90% gate is enforced on
# every run (monitor decision, session 017 — no CI needed to enforce it).
addopts = "--cov=app --cov=scripts --cov-report=term-missing --cov-fail-under=90"

# SQLAlchemy async hops through greenlets; without this the line tracer
# reports false misses on lines that provably execute (session 013).
[tool.coverage.run]
concurrency = ["greenlet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
